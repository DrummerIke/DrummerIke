<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>G7</title>
    <meta name="application-name" content="G7" />
    <meta name="apple-mobile-web-app-title" content="G7" />
    <meta name="theme-color" content="#111111" />
    <meta name="description" content="Стартовая страница G7" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #111111;
        color: #ffffff;
      }

      main {
        width: min(90vw, 28rem);
        text-align: center;
      }

      .logo {
        width: 5rem;
        height: 5rem;
        margin: 0 auto 1.5rem;
        display: grid;
        place-items: center;
        border-radius: 1.25rem;
        background: #ffffff;
        color: #111111;
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.08em;
      }

      .button {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.9rem 1.25rem;
        border-radius: 999px;
        background: #ffffff;
        color: #111111;
        font-weight: 700;
        text-decoration: none;
      }

      .hint {
        margin-top: 1rem;
        color: #cccccc;
        font-size: 0.95rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">G7</div>
      <h1>G7</h1>
      <p>Сначала сохраните эту страницу на экран «Домой», а затем открывайте G7 через кнопку ниже.</p>
      <a class="button" href="https://sites.google.com/view/borkg7/">Открыть G7</a>
      <p class="hint">Так браузер успеет показать меню «Добавить на экран Домой» для страницы с названием G7 и этой иконкой.</p>
    </main>
  </body>
</html>
